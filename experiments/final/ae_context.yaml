experiment_id: final-ae-context-v1
title: "Final AE context-compatible feature set"

random_seed: 42

dataset:
  name: CIC-IDS2017
  version: "raw-v1"
  raw_dir: "data/raw/cicids2017"
  output_dir: "data/processed/final/ae_context"
  label_column_candidates:
    - Label
    - label

split:
  benign_train_ratio: 0.70
  benign_val_ratio: 0.15
  benign_calib_ratio: 0.075
  benign_test_ratio: 0.075
  attack_calib_ratio: 0.50
  attack_test_ratio: 0.50

features:
  set_name: context_v1_current_compatible
  numeric:
    - destination_port
    - flow_duration
    - total_fwd_packets
    - total_backward_packets
    - flow_bytes_per_sec
    - flow_packets_per_sec
  categorical:
    - protocol
  drop_if_missing_all:
    - destination_port
    - flow_duration
    - total_fwd_packets
    - total_backward_packets
    - flow_bytes_per_sec
    - flow_packets_per_sec

context_features_todo:
  status: "planned"
  reason: "Kept out of features.numeric so this config remains executable with current ml/src/build_dataset.py."
  planned_numeric:
    - src_flow_count_1m
    - src_flow_count_5m
    - src_unique_dst_port_count_1m
    - src_unique_dst_port_count_5m
    - dst_port_hit_count_1m
    - dst_port_hit_count_5m
    - src_bytes_sum_1m
    - src_packets_sum_1m

preprocess:
  scaler: standard
  one_hot: true
  handle_unknown: ignore

output:
  train_file: "train.parquet"
  val_file: "val.parquet"
  calib_file: "calib.parquet"
  test_file: "test.parquet"
  preprocess_file: "preprocess.pkl"

model:
  type: autoencoder_sklearn
  hidden_layer_sizes: [32, 16, 8, 16, 32]
  activation: relu
  solver: adam
  alpha: 0.0001
  batch_size: 32
  learning_rate_init: 0.001
  max_iter: 200
  tol: 0.0001
  n_iter_no_change: 5
  early_stopping: false
  validation_fraction: 0.1

thresholds:
  fixed: 0.01
  percentile: 95
  search_steps: 200

paths:
  artifacts_dir: "artifacts/final/final-ae-context-v1"
  results_dir: "results/final/final-ae-context-v1"
