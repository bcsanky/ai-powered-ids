experiment_id: final-hybrid-v1
title: "Final hybrid IDS configuration"

random_seed: 42

dev_sample:
  enabled: false
  max_rows_total: null

dataset:
  name: CIC-IDS2017
  version: "raw-v1"

components:
  ae_model:
    experiment_id: final-ae-minimal-v1
    config: experiments/final/ae_minimal.yaml
    artifacts_dir: "artifacts/final/final-ae-minimal-v1"
    results_dir: "results/final/final-ae-minimal-v1"
  wazuh_baseline:
    experiment_id: final-baseline-wazuh-v1
    config: experiments/final/baseline_wazuh.yaml
    results_dir: "results/final/final-baseline-wazuh-v1"

hybrid_policy:
  type: union
  alert_when:
    - "ae_prediction == 1"
    - "wazuh_prediction == 1"
  score_combination: "max_normalized_score"

paths:
  artifacts_dir: "artifacts/final/final-hybrid-v1"
  results_dir: "results/final/final-hybrid-v1"

notes:
  - "Planning config only for this step; current ml/src/eval.py does not yet implement hybrid fusion."
  - "Final implementation should join AE predictions and Wazuh alerts on a stable event or flow identifier."
