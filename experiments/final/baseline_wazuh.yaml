experiment_id: final-baseline-wazuh-v1
title: "Final Wazuh baseline"

random_seed: 42

dev_sample:
  enabled: false
  max_rows_total: null

dataset:
  name: CIC-IDS2017
  version: "raw-v1"
  data_dir: "data/processed/final/wazuh"

baseline:
  type: wazuh
  method: exported_wazuh_alerts
  prediction_columns:
    - wazuh_alert
    - is_alert
    - alert
    - prediction
    - y_pred
  score_columns:
    - alert_score
    - rule_level
    - score
    - anomaly_score

inputs:
  wazuh_input_candidates:
    - "wazuh_eval.parquet"
    - "wazuh_eval.csv"
    - "wazuh_eval.jsonl"
    - "wazuh_alerts.parquet"
    - "wazuh_alerts.csv"
    - "wazuh_alerts.jsonl"

paths:
  results_dir: "results/final/final-baseline-wazuh-v1"

commands:
  eval: "python3 -m ml.src.eval --baseline wazuh --data-dir data/processed/final/wazuh --results-dir results/final/final-baseline-wazuh-v1"

notes:
  - "Requires a Wazuh export with labels and alert/prediction columns before evaluation."
