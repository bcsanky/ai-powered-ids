experiment_id: ae-enriched
feature_set_name: enriched

features:
  columns:
    - destination_port
    - flow_duration
    - total_fwd_packets
    - total_backward_packets
    - flow_bytes_per_sec
    - flow_packets_per_sec
    - is_rare_dst_port
    - dst_port_frequency_rank
    - fwd_bwd_packet_ratio
    - is_extreme_packet_rate
    - log_flow_duration
    - log_flow_bytes_per_sec

preprocessing:
  scale_numeric: true
  encode_categorical: false
  drop_na: true
  replace_inf: true

model:
  type: autoencoder
  latent_dim: 16
  dropout: 0.0
  learning_rate: 0.001
  epochs: 100
  batch_size: 32
  early_stopping: true

threshold:
  method: val_f1_opt

dataset:
  output_dir: "data/processed/enriched"

output:
  train_file: "train.parquet"
  val_file: "val.parquet"
  calib_file: "calib.parquet"
  test_file: "test.parquet"
  preprocess_file: "preprocess.pkl"

paths:
  artifacts_dir: "artifacts/ae/enriched"
  results_dir: "results/enriched"
